# A tag push runs the whole CI build, then publishes the workspace to npm as one
# fixed-version set. Versions the registry already holds are skipped, so a tag
# that only moves some packages is safe to push.
#
# Needs an NPM_TOKEN secret with publish rights to the @crombolo scope.
name: Release

# What the Actions list shows for the run. Without this, a push event is titled
# with the tagged commit's message — so a release reads as whatever the last commit
# happened to say, and two releases are told apart only by date. The tag is the one
# thing a release is actually about, so it goes in the title.
run-name: release ${{ github.ref_name }}

on:
    push:
        tags: ["v*"]

concurrency:
    group: release-${{ github.ref }}

env:
    BUN_VERSION: "1.4.2"

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        # A release always runs the browser suite and both database dialects,
        # whatever the tagged commit says: main runs SQLite alone to stay fast.
        with:
            browser_tests: true
            postgres_tests: true

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Signs npm provenance from this workflow's identity.
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            # For the npm CLI, which uploads the tarballs Bun packs, and the .npmrc it
            # authenticates with.
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - run: bun install --frozen-lockfile

            - name: Check the tag matches the package version
              run: |
                  version="$(bun --print 'require("./packages/crombolo/package.json").version')"
                  tag="${GITHUB_REF_NAME#v}"
                  if [ "$version" != "$tag" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match @crombolo/crombolo@$version" >&2
                    exit 1
                  fi

            - run: bun run generate:types

            - uses: actions/cache@v4
              id: dist
              with:
                  path: packages/backoffice-dist/dist
                  key: >-
                      backoffice-dist-${{ hashFiles('bun.lock', 'scripts/vendor-backoffice.ts',
                      'packages/backoffice-dist/upstream-static/**') }}
            - if: steps.dist.outputs.cache-hit != 'true'
              run: bun run vendor:backoffice

            - run: bun run release:publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    # Our own product site runs on the platform as an ordinary tenant, so a
    # release republishes its content the way a customer's CI would (`115` in
    # crombolo-enterprise). It publishes to **preview**; production is promoted
    # by hand once somebody has looked at it.
    #
    # Gated on a repository variable rather than on a secret being absent: a
    # rotated or deleted secret is indistinguishable from "not set up yet", and
    # a publish that quietly stops happening is the thing this job exists to
    # prevent. Off, it skips and says so. On, any failure fails the release.
    brochureware:
        needs: publish
        if: vars.BROCHUREWARE_PUBLISH == 'enabled'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - run: bun install --frozen-lockfile

            - name: Publish the product site to preview
              run: bun run brochureware:publish
              env:
                  CROMBOLO_PLATFORM_URL: ${{ vars.CROMBOLO_PLATFORM_URL }}
                  CROMBOLO_PLATFORM_TOKEN: ${{ secrets.CROMBOLO_PLATFORM_TOKEN }}
                  CROMBOLO_PLATFORM_ORGANISATION: ${{ vars.CROMBOLO_PLATFORM_ORGANISATION }}
                  CROMBOLO_PLATFORM_SITE: ${{ vars.CROMBOLO_PLATFORM_SITE }}
                  CROMBOLO_PLATFORM_ENVIRONMENT: ${{ vars.CROMBOLO_PLATFORM_PREVIEW }}

            - name: Say that production is still waiting
              run: |
                  {
                    echo "### Product site"
                    echo
                    echo "Published to **preview**. Promote it to production once it looks right."
                  } >> "$GITHUB_STEP_SUMMARY"

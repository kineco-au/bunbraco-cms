[workflow]
alias = "document-review"
name = "Document Review"
applies-to = { branches = [], content-types = [] }
publishers-may-skip = true
on-edit = "withdraw"
self-approval = "refused"
comments = "optional"
unpublish = false
on-change = "keep"

[[stage]]
alias = "review"
name = "Review"
approvers = ["writer"]
required = "one"
next = ["stage-2-review"]
send-back = "editor"
position = { x = 0, y = 0 }

[[stage]]
alias = "stage-2-review"
name = "Second Review"
approvers = ["sensitiveData"]
required = "one"
next = []
send-back = "editor"
position = { x = 240, y = 0 }

# A page type of its own rather than another `contentPage`: the layout is a form
# beside an address panel, which is a different thing from prose with a picture,
# and branching one template on which properties happen to be filled is how a
# view becomes unreadable.
[document-type]
key = "7100a925-a7e5-48a4-ad8e-120fc08cf987"
alias = "contactPage"
name = "Contact Page"
description = "A form and the details beside it"
icon = "icon-message"
components = ["pages/contactPage"]
default-component = "pages/contactPage"

[[tab]]
name = "Header"

[[tab.property]]
key = "753d8c52-4949-4e92-a76a-fa02da0fd199"
alias = "eyebrow"
name = "Eyebrow"
type = "textstring"

[[tab.property]]
key = "1e8f3a9d-5bdf-4a01-a6c7-cc4a055fae22"
alias = "title"
name = "Title"
type = "textstring"
mandatory = true

[[tab.property]]
key = "cf4561c0-82bb-4ad5-9f88-bd3fbd210b7c"
alias = "standfirst"
name = "Standfirst"
type = "textarea"

[[tab]]
name = "Form"

# `formPicker` is seeded with the other built-in data types, so a property can
# use it with no file of its own. The value is a form's UUID from
# `schema/forms/`, and the value converter hands the view the definition rather
# than the key — see `components/contactPage.tsx`.
[[tab.property]]
key = "9f2c71b5-5de4-4a6e-9c0a-1b7d84f3a2ce"
alias = "enquiryForm"
name = "Form"
description = "Leave empty for a page that only gives the address."
type = "formPicker"

[[tab]]
name = "Details"

[[tab.property]]
key = "74ad36ef-7bc9-44a5-833b-a5ebbc055198"
alias = "asideEyebrow"
name = "Eyebrow"
type = "textstring"

[[tab.property]]
key = "f280c253-5a8e-4db2-8cd6-516066061242"
alias = "asideHeading"
name = "Heading"
type = "textstring"

[[tab.property]]
key = "5611c2fa-720b-447a-9b01-c8e761e738ac"
alias = "asideBody"
name = "Address and contact"
type = "richtext"

[[tab.property]]
key = "278a95aa-9a7d-47bc-ad09-545104a1a7cd"
alias = "asideImage"
name = "Image"
type = "imageMediaPicker"
